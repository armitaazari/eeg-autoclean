[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg_autoclean"
version = "0.1.0"
description = "Automatic detection and flagging of eye-blink and muscle artifacts in EEG signals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mne>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
consensus = [
    "autoreject>=0.4",
]

[tool.setuptools.packages.find]
include = ["eeg_autoclean*"]
